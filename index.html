<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Top 10</title>
<!-- fonts below are only for the pictures the page draws; the page itself uses the system font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Bebas+Neue&family=Inter:wght@400;600&family=Oswald:wght@500;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff; --fg: #222222; --muted: #666666; --rule: #d4d4d4; --link: #1a5fb4;
  --bar: #2f3b33; --bar-fg: #f2f2f2; --row-alt: #f7f7f7; --field-border: #999999; --error: #b00020;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1b1b; --fg: #dddddd; --muted: #9a9a9a; --rule: #3a3a3a; --link: #8ab4f8;
    --bar: #101411; --bar-fg: #e6e6e6; --row-alt: #222222; --field-border: #555555; --error: #ff8a8a;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
a { color: var(--link); }
.wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }
.topbar { background: var(--bar); color: var(--bar-fg); }
.topbar .wrap { display: flex; justify-content: space-between; align-items: baseline; padding-top: 10px; padding-bottom: 10px; }
.brand { font-weight: 700; font-size: 17px; }
.topbar nav a { color: var(--bar-fg); margin-left: 16px; font-size: 14px; }
main { padding-bottom: 48px; }
.intro { margin: 20px 0 16px; }
h2 { font-size: 18px; margin: 32px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--rule); }
label.field { display: block; font-weight: 600; margin: 12px 0 4px; }
button, input { font: inherit; color: inherit; }
input[type=text], input[type=search], input[type=password] {
  width: 100%; padding: 6px 8px; border: 1px solid var(--field-border); border-radius: 2px; background: var(--bg); color: var(--fg);
}
.under-input { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; font-size: 13px; color: var(--muted); margin: 4px 0 8px; min-height: 1.5em; }
.linklike { background: none; border: none; padding: 0; color: var(--link); text-decoration: underline; cursor: pointer; font-size: 13px; }
.linklike:disabled { color: var(--muted); text-decoration: none; cursor: default; }
.submit { min-height: 34px; padding: 4px 18px; border: 1px solid #777777; border-radius: 3px; background: linear-gradient(#fafafa, #e4e4e4); color: #111111; cursor: pointer; }
.submit:hover:not(:disabled) { background: linear-gradient(#ffffff, #d8d8d8); }
.submit:disabled { color: #888888; cursor: default; }
input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--link); outline-offset: 1px; }
.small { font-size: 13px; }
.muted { color: var(--muted); }
.table-wrap { overflow-x: auto; }
.hits { width: 100%; border-collapse: collapse; font-size: 14px; }
.hits th { text-align: left; font-weight: 600; padding: 4px 8px; border-bottom: 2px solid var(--rule); }
.hits td { padding: 3px 8px; border-bottom: 1px solid var(--rule); }
.hits tbody tr:nth-child(even) { background: var(--row-alt); }
.hits .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; width: 1%; }
.hits .acts { white-space: nowrap; text-align: right; width: 1%; }
.hits .acts .linklike + .linklike { margin-left: 10px; }
.results { max-height: 320px; overflow: auto; border-bottom: 1px solid var(--rule); }
.mode { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 8px 0 12px; }
.mode .group { display: flex; }
.mode button { padding: 6px 14px; min-height: 36px; border: 1px solid var(--field-border); background: var(--bg); font-size: 14px; cursor: pointer; }
.mode button + button { border-left: none; }
.mode button[aria-pressed=true] { background: var(--row-alt); font-weight: 600; }
canvas { width: 100%; height: auto; display: block; border: 1px solid var(--rule); }
.actions { margin: 10px 0 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.actions input { flex: 1; min-width: 200px; width: auto; }
.error { color: var(--error); }
.singles { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 4px; }
.singles canvas { height: 150px; width: auto; flex: none; }
.about p { margin: 0 0 10px; }
@media (max-width: 560px) { .hide-narrow { display: none; } }
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <span class="brand">Top 10</span>
  </div>
</header>

<main class="wrap">
  <div class="mode" style="margin-top:20px">
    <div class="group" role="group" aria-label="List">
      <button data-kind="movie">Movies</button>
      <button data-kind="tv">TV</button>
    </div>
  </div>

  <label class="field" for="title">Title on the picture</label>
  <input id="title" type="text" maxlength="40">

  <label class="field" for="q" id="qlabel">Add a movie</label>
  <input id="q" type="search" placeholder="e.g. Alien" autocomplete="off">
  <div class="under-input">
    <span id="status" aria-live="polite"></span>
  </div>
  <div class="table-wrap results" id="resultswrap" hidden>
    <table class="hits">
      <thead><tr><th>Title</th><th class="num">Year</th><th class="hide-narrow bycol">Director</th><th></th></tr></thead>
      <tbody id="results"></tbody>
    </table>
  </div>

  <h2>Your list (<span id="count">0</span>/10)</h2>
  <p class="small muted" id="pickhint">Nothing here yet. Search above to add movies.</p>
  <div class="table-wrap" id="pickswrap">
    <table class="hits">
      <thead><tr><th class="num">#</th><th>Title</th><th class="num">Year</th><th class="hide-narrow bycol">Director</th><th></th></tr></thead>
      <tbody id="picks"></tbody>
    </table>
  </div>
  <div class="under-input"><span id="logostatus" class="error" aria-live="polite"></span><button type="button" class="linklike" id="clear">clear list</button></div>

  <h2>Picture</h2>
  <div class="mode">
    <div class="group" role="group" aria-label="View">
      <button data-view="spines">Spines</button>
      <button data-view="tapes">Tapes</button>
      <button data-view="covers">Covers</button>
    </div>
  </div>
  <canvas id="cv" width="1600" height="1000"></canvas>
  <div class="actions"><button type="button" class="submit" id="download">Download PNG</button></div>

  <h2>Post to X</h2>
  <label class="field" for="caption">Caption</label>
  <div class="actions" style="margin-top:0">
    <input id="caption" type="text" maxlength="280" placeholder="optional">
    <button type="button" class="submit" id="post">Post to X</button>
  </div>
  <p class="small muted" id="poststatus"></p>
  <div class="singles" id="singles" aria-label="The pictures that will be posted"></div>

  <p class="small muted" style="margin-top:40px">Posters and details from <a href="https://www.wikipedia.org/">Wikipedia</a> and
    <a href="https://www.themoviedb.org/">TMDB</a>. This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
</main>

<!-- your own settings (the TMDB key); the page works without this file -->
<script src="config.js"></script>
<script>
(() => {
  const MAX = 10;
  const KEY = 'top10movies.v1';
  // wording that changes between the movie list and the TV list
  const KINDS = {
    movie: { add: 'Add a movie', eg: 'e.g. Alien', by: 'Director', hint: 'Nothing here yet. Search above to add movies.',
      none: 'No movies found. Try adding the year.', one: 'film', many: 'films', file: 'movies', title: 'My Top 10 Movies', caption: 'My top 10 movies' },
    tv: { add: 'Add a show', eg: 'e.g. Breaking Bad', by: 'Network', hint: 'Nothing here yet. Search above to add shows.',
      none: 'No shows found. Try another spelling.', one: 'show', many: 'shows', file: 'shows', title: 'My Top 10 Shows', caption: 'My top 10 shows' },
  };
  const newList = (k) => ({ title: KINDS[k].title, caption: KINDS[k].caption, picks: [] });
  const state = { kind: 'movie', view: 'spines', backdrop: 'dark', tmdbKey: '', useLogos: true, lists: { movie: newList('movie'), tv: newList('tv') } };
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
  // lists saved before TV was added kept the movie list at the top level
  if (!saved.lists && saved.picks) saved.lists = { movie: { title: saved.title ?? KINDS.movie.title, caption: saved.caption ?? KINDS.movie.caption, picks: saved.picks } };
  ['title', 'caption', 'picks'].forEach((k) => delete saved[k]);
  Object.assign(state, saved, { lists: { ...state.lists, ...(saved.lists || {}) } });
  if (!KINDS[state.kind]) state.kind = 'movie';
  const L = () => state.lists[state.kind], K = () => KINDS[state.kind];
  delete state.spineStyle; state.backdrop = 'dark'; state.useLogos = true; // dark backdrop, title logos on
  // a key written in config.js wins over one typed into the page
  const CONFIG_KEY = String((window.TOP10_CONFIG && window.TOP10_CONFIG.tmdbKey) || '').trim();
  if (CONFIG_KEY) state.tmdbKey = CONFIG_KEY;
  const save = () => {
    try { localStorage.setItem(KEY, JSON.stringify(CONFIG_KEY ? { ...state, tmdbKey: '' } : state)); } catch (e) {}
  };

  const $ = (s) => document.querySelector(s);
  const cv = $('#cv');

  /* ---------- Wikipedia ---------- */
  const API = 'https://en.wikipedia.org/w/api.php';
  const BASE = { action: 'query', format: 'json', formatversion: '2', origin: '*',
    prop: 'pageimages|description', piprop: 'thumbnail', pithumbsize: '600', pilicense: 'any' };

  function toMovie(p) {
    const desc = p.description || '';
    return {
      id: p.pageid,
      w: p.title,
      t: p.title.replace(/\s*\([^)]*\bfilm\)$/i, ''),
      y: (desc.match(/\b(18|19|20)\d{2}\b/) || [''])[0],
      by: (desc.match(/\bby (.+)$/i) || [, ''])[1].replace(/^\w/, (c) => c.toUpperCase()),
      art: p.thumbnail ? p.thumbnail.source : '',
      v: 0,
    };
  }
  const isFilm = (p) => /\b(film|movie)\b/i.test(p.description || '') && !/franchise|series|soundtrack|character|festival|award|studio|company|director|actor|actress/i.test(p.description || '');

  async function wikiSearch(q) {
    const u = new URL(API);
    Object.entries({ ...BASE, generator: 'search', gsrsearch: q, gsrlimit: '20' }).forEach(([k, v]) => u.searchParams.set(k, v));
    const d = await (await fetch(u)).json();
    return ((d.query && d.query.pages) || []).sort((a, b) => a.index - b.index);
  }

  // TV shows on Wikipedia, used only when there is no TMDB key
  const isShow = (p) => /\b(television|tv|web|animated|anime)\b.*\b(series|sitcom|show|miniseries|drama|programme|program)\b|\bsitcom\b|\bminiseries\b/i.test(p.description || '') &&
    !/\b(season|episode|character|franchise|soundtrack|film|actor|actress|host|presenter|network|channel)\b/i.test(p.description || '');
  function toShow(p) {
    const desc = p.description || '', yr = desc.match(/\b((?:19|20)\d{2})(?:\s*[–-]\s*((?:19|20)\d{2}|present))?/);
    return {
      id: p.pageid, kind: 'tv', w: p.title,
      t: p.title.replace(/\s*\([^)]*\b(series|miniseries|sitcom|show)\)$/i, ''),
      y: yr ? (yr[2] ? `${yr[1]}–${yr[2] === 'present' ? '' : yr[2]}` : yr[1]) : '',
      by: '', art: p.thumbnail ? p.thumbnail.source : '', v: 0,
    };
  }

  async function search(q) {
    if (state.kind === 'movie') return (await wikiSearch(q + ' film')).filter(isFilm).map(toMovie);
    if (state.tmdbKey) { // TMDB knows every show, with its poster
      const d = await tmdb('/search/tv', { query: q });
      return (d.results || []).slice(0, 20).map((r) => ({
        id: 'tv' + r.id, tmdb: r.id, kind: 'tv', t: r.name, y: (r.first_air_date || '').slice(0, 4), by: '',
        art: r.poster_path ? 'https://image.tmdb.org/t/p/w500' + r.poster_path : '', v: 0,
      }));
    }
    return (await wikiSearch(q + ' television series')).filter(isShow).map(toShow);
  }
  /* ---------- colour + random helpers ---------- */
  function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
  function rng(seed) { return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const lum = ([r, g, b]) => (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
  const css = ([r, g, b], a = 1) => `rgba(${r | 0},${g | 0},${b | 0},${a})`;
  const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
  function hsl(h, s, l) { const k = (n) => (n + h / 30) % 12, a = s * Math.min(l, 1 - l), f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1)); return [f(0) * 255, f(8) * 255, f(4) * 255]; }

  const palCache = new Map();
  function palette(img, key) {
    if (palCache.has(key)) return palCache.get(key);
    const r = rng(hash(key)), h = r() * 360;
    let pal = { vivid: hsl(h, .55, .45), dark: hsl(h, .3, .12), light: hsl(h, .25, .9) };
    if (img) {
      try {
        const c = document.createElement('canvas'); c.width = 24; c.height = 36;
        const x = c.getContext('2d', { willReadFrequently: true });
        x.drawImage(img, 0, 0, 24, 36);
        const d = x.getImageData(0, 0, 24, 36).data, px = [];
        for (let i = 0; i < d.length; i += 4) {
          const p = [d[i], d[i + 1], d[i + 2]], mx = Math.max(...p), mn = Math.min(...p);
          px.push({ p, l: lum(p), s: mx ? ((mx - mn) / mx) * (mx / 255) : 0 });
        }
        const avg = (a) => a.reduce((s, q) => s.map((v, i) => v + q.p[i]), [0, 0, 0]).map((v) => v / a.length);
        const bySat = [...px].sort((a, b) => b.s - a.s), byL = [...px].sort((a, b) => a.l - b.l);
        let vivid = avg(bySat.slice(0, Math.ceil(px.length * .12)));
        const vl = lum(vivid);
        if (vl > .72) vivid = mix(vivid, [0, 0, 0], .3);
        if (vl < .1) vivid = mix(vivid, [255, 255, 255], .18);
        pal = {
          vivid,
          dark: mix(avg(byL.slice(0, Math.ceil(px.length * .3))), [0, 0, 0], .4),
          light: mix(avg(byL.slice(-Math.ceil(px.length * .2))), [250, 247, 240], .6),
        };
      } catch (e) { /* tainted canvas: keep the fallback colours */ }
    }
    palCache.set(key, pal);
    return pal;
  }

  const imgCache = new Map();
  function loadImg(src) {
    if (!src) return Promise.resolve(null);
    if (!imgCache.has(src)) imgCache.set(src, new Promise((res) => {
      const i = new Image(); i.crossOrigin = 'anonymous';
      i.onload = () => res(i); i.onerror = () => res(null); i.src = src;
    }));
    return imgCache.get(src);
  }

  /* ---------- drawing helpers ---------- */
  function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
  function drawCover(ctx, img, x, y, w, h, fy = .35) {
    const s = Math.max(w / img.width, h / img.height), sw = w / s, sh = h / s;
    ctx.drawImage(img, (img.width - sw) / 2, (img.height - sh) * fy, sw, sh, x, y, w, h);
  }
  // fit text into a box of length maxLen (along the line) and thickness maxThick (across lines); up to 2 lines
  function fit(ctx, text, font, maxLen, maxThick) {
    ctx.font = font(100);
    const one = Math.min(maxThick, (100 * maxLen) / ctx.measureText(text).width);
    const words = text.split(' ');
    if (words.length > 1 && one < maxThick * .55) {
      let best = null;
      for (let i = 1; i < words.length; i++) {
        const a = words.slice(0, i).join(' '), b = words.slice(i).join(' ');
        const m = Math.max(ctx.measureText(a).width, ctx.measureText(b).width);
        if (!best || m < best.m) best = { a, b, m };
      }
      const two = Math.min(maxThick / 2.1, (100 * maxLen) / best.m);
      if (two > one * 1.1) return { lines: [best.a, best.b], size: two };
    }
    return { lines: [text], size: one };
  }
  function drawLines(ctx, f, font, x, y, color) {
    ctx.font = font(f.size); ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const gap = f.size * 1.02, start = y - ((f.lines.length - 1) * gap) / 2;
    f.lines.forEach((l, i) => ctx.fillText(l, x, start + i * gap + f.size * .04));
  }

  const FONTS = [
    { f: (s) => `${s}px Anton`, up: true },
    { f: (s) => `${s * 1.12}px "Bebas Neue"`, up: true },
    { f: (s) => `700 ${s}px Oswald`, up: true },
    { f: (s) => `${s * .85}px "Archivo Black"`, up: false },
  ];

  const BACKDROPS = {
    light: { wall: '#ebe6db', wall2: '#ddd6c8', ink: '#1b1a17', quiet: 'rgba(27,26,23,.55)', plank: '#b88a5c', plankEdge: '#8d6440', slot: 'rgba(27,26,23,.18)' },
    dark: { wall: '#17140f', wall2: '#0d0b08', ink: '#f2eee5', quiet: 'rgba(242,238,229,.55)', plank: '#4a3524', plankEdge: '#2c1f14', slot: 'rgba(242,238,229,.18)' },
  };

  function background(ctx, W, H, B) {
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, B.wall); g.addColorStop(1, B.wall2);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  function header(ctx, W, B, n) {
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = B.ink; ctx.font = '72px Anton';
    ctx.fillText(L().title || K().title, 80, 128);
    ctx.fillStyle = B.quiet; ctx.font = '600 22px Inter, sans-serif';
    ctx.fillText(n ? `${n} favorite ${n === 1 ? K().one : K().many}` : `Add some ${K().file} to get started`, 82, 166);
  }
  function emptySlot(ctx, x, y, w, h, rank, B, radius = 6) {
    ctx.save(); ctx.setLineDash([10, 8]); ctx.lineWidth = 2; ctx.strokeStyle = B.slot;
    rr(ctx, x + 1, y + 1, w - 2, h - 2, radius); ctx.stroke(); ctx.restore();
    ctx.fillStyle = B.slot; ctx.font = `${Math.min(w, h) * .32}px Anton`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(rank, x + w / 2, y + h / 2);
  }
  function badge(ctx, cx, cy, r, rank) {
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fillStyle = '#faf8f2'; ctx.fill(); ctx.restore();
    ctx.fillStyle = '#16150f'; ctx.font = `${r * 1.05}px "Archivo Black"`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(rank, cx, cy + r * .06);
  }

  /* ---------- a VHS case spine ----------
     the poster runs the whole spine, with the title centred on it */
  function drawSpine(ctx, x, y, w, h, it, img, pal, logo, radius = 5) {
    const r = rng(hash(`${it.t}|${it.y}|0`)); // each film always gets the same fallback font
    const F = FONTS[Math.floor(r() * FONTS.length)];
    ctx.save(); rr(ctx, x, y, w, h, radius); ctx.clip();

    // poster, edge to edge
    if (img) drawCover(ctx, img, x, y, w, h, .5);
    else { ctx.fillStyle = css(pal.dark); ctx.fillRect(x, y, w, h); }
    const bg = [28, 28, 28], ink = [250, 248, 242];

    // the film's own title logo when we have one, otherwise the title set in a font, reading top to bottom like a US tape.
    // A soft shadow keeps it readable on a busy poster
    const top = y + w * .35, len = h - w * .7, mid = top + len / 2;
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.7)'; ctx.shadowBlur = w * .06;
    if (logo) drawLogo(ctx, logo, x + w / 2, mid, len * .9, w * .74, w * .8, bg, ink);
    else {
      const title = F.up ? it.t.toUpperCase() : it.t;
      const f = fit(ctx, title, F.f, len * .94, w * .6);
      ctx.translate(x + w / 2, mid); ctx.rotate(Math.PI / 2);
      drawLines(ctx, f, F.f, 0, 0, css(ink));
    }
    ctx.restore();

    // plastic case shading
    const g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, 'rgba(255,255,255,.28)'); g.addColorStop(.06, 'rgba(255,255,255,.08)'); g.addColorStop(.2, 'rgba(255,255,255,.12)');
    g.addColorStop(.3, 'rgba(255,255,255,0)'); g.addColorStop(.85, 'rgba(0,0,0,.1)'); g.addColorStop(1, 'rgba(0,0,0,.45)');
    ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
    ctx.restore();

    ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1.5; rr(ctx, x + .75, y + .75, w - 1.5, h - 1.5, radius); ctx.stroke();
  }

  /* ---------- title logos ---------- */
  const logoLumCache = new WeakMap(), tintCache = new Map();
  function logoLum(img) { // brightness of the logo's visible pixels, and how much it varies inside the logo
    if (logoLumCache.has(img)) return logoLumCache.get(img);
    let v = { mean: .5, spread: 0 };
    try {
      const c = document.createElement('canvas'); c.width = 96; c.height = 48;
      const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(img, 0, 0, 96, 48);
      const d = x.getImageData(0, 0, 96, 48).data; let s = 0, s2 = 0, n = 0;
      for (let i = 0; i < d.length; i += 4) {

  function applyKind() {
    const k = K();
    $('#qlabel').textContent = k.add; $('#q').placeholder = k.eg; $('#pickhint').textContent = k.hint;
    document.querySelectorAll('.bycol').forEach((th) => { th.textContent = k.by; });
    $('#title').value = L().title; $('#caption').value = L().caption;
    $('#q').value = ''; lastResults = []; $('#status').textContent = ''; $('#poststatus').textContent = '';
  }
  document.querySelectorAll('[data-kind]').forEach((b) => b.addEventListener('click', () => {
    if (state.kind === b.dataset.kind) return;
    state.kind = b.dataset.kind; applyKind(); syncTabs(); renderPicks();
  }));

  /* ---------- post to X ----------
     No website can attach pictures to an X post by itself. On a phone the share sheet hands the
     pictures to the X app; on a computer we save them as a zip and open X's composer with the caption. */
  $('#caption').value = L().caption;
  $('#caption').addEventListener('input', (e) => { L().caption = e.target.value; save(); });
  $('#post').addEventListener('click', async () => {
    if (!L().picks.length) return;
    const text = $('#caption').value.trim(), status = $('#poststatus'), btn = $('#post');
    let viaShare = false;
    try {
      viaShare = matchMedia('(pointer: coarse)').matches && !!navigator.canShare &&
        navigator.canShare({ files: [new File([new Uint8Array(1)], 't.jpg', { type: 'image/jpeg' })] });
    } catch (e) {}
    // open X first, while the click still counts, so the popup isn't blocked
    if (!viaShare) window.open('https://x.com/intent/post?text=' + encodeURIComponent(text), '_blank', 'noopener');
    btn.disabled = true; status.textContent = 'Making pictures…';
    try {
      const files = await singleFiles();
      if (viaShare) {
        await navigator.share({ files, ...(text && { text }) });
        status.textContent = 'Shared.';
      } else {
        const name = `top-${files.length}-${K().file}-${state.view}.zip`;
        saveBlob(await makeZip(files), name);
        status.textContent = `Saved ${name} and opened X in a new tab. Unzip it, then drag all ${files.length} pictures into the post, 01 first.`;
      }
    } catch (e) {
      if (e.name !== 'AbortError') status.textContent = 'Could not make the pictures: ' + e.message;
    }
    btn.disabled = false;
  });
  document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => { state.view = b.dataset.view; syncTabs(); save(); render(); }));

  $('#download').addEventListener('click', () => {
    try {
      cv.toBlob((blob) => {
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
        a.download = `top10-${K().file}-${state.view}.png`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      }, 'image/png');
    } catch (e) { alert('This image cannot be saved because a poster blocked cross-site use.'); }
  });

  // ?view=tapes picks a view, ?list=tv opens the TV list
  const qs = new URLSearchParams(location.search);
  if (SCENES[qs.get('view')]) state.view = qs.get('view');
  if (KINDS[qs.get('list')]) state.kind = qs.get('list');
  applyKind(); syncTabs();
  renderPicks();
})();
</script>
</body>
</html>
